<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="DESI-NEXUS">
  <!--
    The tab mark: the same diamond-and-vesica drawn by components/site/Logo.tsx,
    on the brand's wine ground, scaled to leave a margin inside the rounded
    square. One geometry, so the favicon and the lockup are the same object
    rather than two drawings that happen to resemble each other.

    The lens is knocked out of the diamond with fill-rule="evenodd", not painted
    over it in the background colour. That is what lets the identical path be
    reused on paper, over a photograph and embroidered, where a faked knockout
    would show as a wine-coloured blob floating in the middle of the mark.

    SVG so it is sharp from 16px to 512px out of one file well under a kilobyte,
    and so the colours are the palette's own values rather than a screenshot.
  -->
  <rect width="64" height="64" rx="14" fill="#26040f"/>
  <path fill="#c9a227" fill-rule="evenodd"
        d="M32 10 54 32 32 54 10 32Z M32 19.3 A13.5 13.5 0 0 1 32 44.7 A13.5 13.5 0 0 1 32 19.3Z"/>
</svg>
